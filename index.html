<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>speed memory</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      background: #f3f5f9;
      color: #172033;
    }

    main {
      width: min(100%, 560px);
      margin: 0 auto;
      padding: 24px;
      border-radius: 16px;
      background: white;
      box-shadow: 0 8px 28px rgb(23 32 51 / 10%);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    .number-buttons {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    button,
    input {
      min-height: 48px;
      padding: 12px;
      border: 1px solid #aeb8c9;
      border-radius: 8px;
      font: inherit;
    }

    button {
      border: 0;
      background: #2457c5;
      color: white;
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid #84aaff;
      outline-offset: 2px;
    }

    .guess-controls {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    input {
      min-width: 0;
      flex: 1;
      font-size: 16px;
    }

    #display-area {
      min-height: 1.3em;
      margin: 24px 0 8px;
      overflow-wrap: anywhere;
      text-align: center;
      font-size: clamp(2rem, 10vw, 3.5rem);
      font-weight: 700;
    }

    #feedback {
      min-height: 1.5em;
      text-align: center;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      main {
        padding: 20px 16px;
      }

      .number-buttons {
        grid-template-columns: 1fr;
      }

      .guess-controls {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Speed Memory</h1>
    <div class="number-buttons">
      <button onclick="generateNumber(1300, 6)">
        Generate Number
      </button>
      <button onclick="generateNumber(1000, 6)">
        Generate Number hard
      </button>
      <button onclick="generateNumber(2000, 12)">
        Generate Number mega hard
      </button>
    </div>
    <div class="guess-controls">
      <input type="text" id="myInput" inputmode="numeric" pattern="[0-9]*" maxlength="12" placeholder="Enter your 6- or 12-digit guess" aria-label="Your number guess">
      <button onclick="checkGuess()">Check Guess</button>
    </div>

    <p id="display-area"></p>
    <p id="feedback" aria-live="polite"></p>
  </main>

  <script>
    let answer;
    let answerDigits;
    let clearNumberTimeout;

    function generateNumber(displayDuration, digits) {
      answerDigits = digits;
      const minimum = 10 ** (digits - 1);
      answer = Math.floor(Math.random() * (9 * minimum)) + minimum;
      document.getElementById('display-area').innerText = answer;
      document.getElementById('feedback').innerText = '';

      clearTimeout(clearNumberTimeout);
      clearNumberTimeout = setTimeout(() => {
        document.getElementById('display-area').innerText = '';
      }, displayDuration);
    }

    function checkGuess() {
      const guess = Number(document.getElementById('myInput').value);
      const feedback = document.getElementById('feedback');

      if (answer === undefined) {
        feedback.innerText = 'Generate a number first.';
      } else {
        const minimum = 10 ** (answerDigits - 1);
        const maximum = 10 ** answerDigits - 1;

        if (!Number.isSafeInteger(guess) || guess < minimum || guess > maximum) {
          feedback.innerText = `Enter a ${answerDigits}-digit whole number.`;
        } else if (guess === answer) {
          feedback.innerText = 'Correct! You guessed the number.';
        } else {
          feedback.innerText = 'Not quite. Try again!';
        }
      }
    }
  </script>
</body>
</html>
